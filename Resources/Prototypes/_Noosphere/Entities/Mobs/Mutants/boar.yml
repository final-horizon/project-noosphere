- type: entity
  name: boar
  id: NSMobMutantBoar
  parent: [ SimpleSpaceMobBase, MobCombat ]
  description: Its a boar.
  components:
    - type: InputMover
    - type: MobMover
    - type: HTN
      rootTask:
        task: SimpleHostileCompound
      blackboard:
        NavSmash: !type:Bool
          true
    - type: NpcFactionMember
      factions:
      - SimpleHostile
    - type: Sprite
      drawdepth: Mobs
      sprite: _Noosphere/Mobs/Mutants/boar.rsi
      layers:
      - map: [ "enum.DamageStateVisualLayers.Base" ]
        state: alive
    - type: CombatMode
    - type: Physics
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.40
          density: 80
          mask:
            - MobMask
          layer:
            - MobLayer
    - type: MobState
    - type: MobThresholds
      thresholds:
        0: Alive
        75: Dead
    - type: MovementSpeedModifier
      baseWalkSpeed: 2.5
      baseSprintSpeed: 3
    - type: Stamina
      baseCritThreshold: 100
    - type: DamageStateVisuals
      states:
        Alive:
          Base: alive
        Dead:
          Base: dead
    - type: FootstepModifier
      footstepSoundCollection:
        collection: MutantStepHoof
    - type: MeleeWeapon
      altDisarm: false
      angle: 0
      animation: WeaponArcBite
      soundHit:
        collection: MutantAttackBoar
      damage:
        types:
          Blunt: 13
          Slash: 7
    - type: Tag
      tags:
      - FootstepSound
      - Mutant
    - type: Vocal
      emoteSounds: MutantBoar
    - type: Deathgasp
      prototype: MutantDeathgasp
    - type: AutoEmote
      emotes:
      - MutantIdle
    - type: Speech
      allowedEmotes:
        - MutantDeathgasp
        - MutantIdle
