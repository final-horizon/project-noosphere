- type: entity
  name: PPSH
  parent: NSBaseWeaponSubMachineGun
  id: NSWeaponSubMachineGunPPSH
  description: placeholder
  components:
  - type: Sprite
    sprite: _Noosphere/Objects/Weapons/Guns/SMGs/ppsh.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Noosphere/Objects/Weapons/Guns/SMGs/ppsh.rsi
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -19
    maxAngle: -16
  - type: Gun
    minAngle: 21
    maxAngle: 32
    shotsPerBurst: 5
    fireRate: 17
    availableModes:
    - FullAuto
    - SemiAuto
    soundGunshot:
      path: /Audio/_Noosphere/Weapons/Guns/Gunshots/ppsh_shot.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolSubMachineGun
        insertSound: /Audio/_Noosphere/Weapons/Guns/Load/berettam38_load.ogg
        ejectSound: /Audio/_Noosphere/Weapons/Guns/Unload/unload_berettam38_open.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolSubMachineGun
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
