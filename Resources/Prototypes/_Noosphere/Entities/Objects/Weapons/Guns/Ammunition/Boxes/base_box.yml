- type: entity
  parent: BaseItem
  id: NSBaseAmmoProvider
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Item
    size: Normal

- type: entity
  abstract: true
  parent: NSBaseAmmoProvider
  id: NSBaseBoxRifle
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - NSCartridgeRifle
    proto: null
    capacity: 30
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Noosphere/Objects/Weapons/Guns/Ammunition/Boxes/Rifle/762x39_box.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: NSBaseAmmoProvider
  id: NSBaseBoxShotgun
  abstract: true
  components:
    - type: Item
      size: Small
    - type: Sprite
      sprite: _Noosphere/Objects/Weapons/Guns/Ammunition/Boxes/Shotgun/buckshot_0.rsi
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
        - NSShellShotgun
      capacity: 16
    - type: MagazineVisuals
      magState: mag
      steps: 2
      zeroVisible: false
    - type: Appearance

- type: entity
  abstract: true
  parent: NSBaseAmmoProvider
  id: NSBaseBoxSniper
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - NSCartridgeSniper
    proto: null
    capacity: 30
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Noosphere/Objects/Weapons/Guns/Ammunition/Boxes/Rifle/3x39_box.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: false
  - type: Appearance
