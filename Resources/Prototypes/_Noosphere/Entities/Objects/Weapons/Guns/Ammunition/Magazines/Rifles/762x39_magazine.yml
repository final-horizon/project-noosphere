- type: entity
  id: NSMagazineRifle762x3930
  name: "7.62x39 Magazine 30x"
  parent: NSBaseMagazineRifle762x39
  description: 30-round double stack magazine for combat rifles. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    capacity: 30
    proto: NSCartridgeRifle762x39FMJ
  - type: Sprite
    sprite: _Noosphere/Objects/Weapons/Guns/Ammunition/Magazines/Rifles/762x39/30.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance


