- type: entity
  id: NSMagazineRifleAKMFMJ30
  name: "AKM Magazine (FMJ 30)"
  parent: NSBaseMagazineRifleAKM
  description: 30-round double stack magazine for combat rifles. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    capacity: 30
    proto: NSCartridgeRifle762x39FMJ
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

