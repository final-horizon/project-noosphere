- type: entity
  id: NSBaseMagazine
  name: "magazine"
  parent: BaseItem
  abstract: true
  components:
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container


