- type: entity
  id: NSBaseMagazine
  name: "magazine"
  parent: BaseItem
  abstract: true
  components:
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container


# Rifles

- type: entity
  id: NSBaseMagazineRifle
  name: "magazine"
  parent: NSBaseMagazine
  abstract: true
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    capacity: 30
  - type: Sprite
    sprite: _Noosphere/Objects/Weapons/Guns/Ammunition/Magazines/Rifles/762x39/30.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance



- type: entity
  id: NSBaseMagazineRifle762x39
  name: "762x39 magazine"
  parent: NSBaseMagazineRifle
  abstract: true
  components:
