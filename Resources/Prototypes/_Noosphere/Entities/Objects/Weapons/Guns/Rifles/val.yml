- type: entity
  name: VSS VAL
  parent: NSBaseWeaponRifle
  id: NSWeaponRifleVal
  description: placeholder
  components:
  - type: Sprite
    sprite: _Noosphere/Objects/Weapons/Guns/Rifles/val.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Noosphere/Objects/Weapons/Guns/Rifles/val.rsi
  - type: Gun
    fireRate: 15
    selectedMode: FullAuto
    availableModes:
      - FullAuto
      - SemiAuto
    soundGunshot:
      path: /Audio/_Noosphere/Weapons/Guns/Gunshots/silencer.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: NSMagazineSniper3x3920
        insertSound: /Audio/_Noosphere/Weapons/Guns/Load/val_load.ogg
        ejectSound: /Audio/_Noosphere/Weapons/Guns/Unload/unload_val_open.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
