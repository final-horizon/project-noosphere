- type: entity
  name: M16
  parent: NSBaseWeaponRifle
  id: NSWeaponRifleM16
  description: placeholder
  components:
  - type: Sprite
    sprite: _Noosphere/Objects/Weapons/Guns/Rifles/m16.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Noosphere/Objects/Weapons/Guns/Rifles/m16.rsi
  - type: Gun
    fireRate: 6
    burstFireRate: 10
    burstCooldown: 0.25
    selectedMode: Burst
    availableModes:
      - Burst
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: NSMagazineRifle556x4530
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - NSMagazineRifle556x45
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - NSCartridgeRifle556x45
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
