- type: entity
  name: FN FAL
  parent: NSBaseWeaponRifle
  id: NSWeaponRifleFNFAL
  description: placeholder
  components:
  - type: Sprite
    sprite: _Noosphere/Objects/Weapons/Guns/Rifles/fnfal.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 10
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/_Noosphere/Weapons/Guns/Gunshots/fnfal_shoot.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/_Noosphere/Weapons/Guns/Load/fnf2000s_load.ogg
        ejectSound: /Audio/_Noosphere/Weapons/Guns/Unload/fnf2000s_open.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
