- type: entity
  name: OC-14 Groza
  parent: NSBaseWeaponRifle
  id: NSWeaponRifleOC14Groza
  description: placeholder
  components:
  - type: Sprite
    sprite: _Noosphere/Objects/Weapons/Guns/Rifles/groza.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Noosphere/Objects/Weapons/Guns/Rifles/groza.rsi
  - type: Gun
    fireRate: 6
    burstFireRate: 10
    burstCooldown: 0.25
    selectedMode: Burst
    availableModes:
      - Burst
      - FullAuto
      - SemiAuto
    soundGunshot:
      path: /Audio/_Noosphere/Weapons/Guns/Gunshots/groza_shot.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: NSMagazineRifle762x3930
        insertSound: /Audio/_Noosphere/Weapons/Guns/Load/groza_load.ogg
        ejectSound: /Audio/_Noosphere/Weapons/Guns/Unload/unload_groza_open.ogg
        priority: 2
        whitelist:
          tags:
            - NSMagazineRifle762x39
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - NSCartridgeRifle762x39
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
